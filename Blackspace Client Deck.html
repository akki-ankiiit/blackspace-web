<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blackspace® — Client Deck (16:9 Presentation)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  
  <!-- CDN React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Scaling Helpers -->
  <script src="deck-stage.js"></script>

  <style>
    :root {
      --paper: #f2ede2;
      --ink: #0a0a0a;
      --mint: #9de6d8;
      --lilac: #dfc4f0;
      --sky: #a7d0f5;
      --butter: #f5d77a;
      --peach: #f6b39a;
      --pop-a: #FF4D1A;
      --pop-b: #FF2E8B;
      --pop-c: #2E4CFF;
      
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --font-italic: 'EB Garamond', serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0d0d !important;
    }
    
    /* Presentation specific layouts */
    .slide-wrapper {
      width: 100%;
      height: 100%;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--paper);
      color: var(--ink);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--ink);
    }
    
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: bold;
      opacity: 0.5;
      border-bottom: 1px solid rgba(10, 10, 10, 0.08);
      padding-bottom: 14px;
      margin-bottom: 24px;
    }

    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: bold;
      opacity: 0.5;
      border-top: 1px solid rgba(10, 10, 10, 0.08);
      padding-top: 14px;
      margin-top: 24px;
    }

    .deck-card {
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 4px 4px 0 var(--ink);
      background-color: var(--paper);
      position: relative;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      flex-grow: 1;
    }
  </style>
</head>
<body>
  
  <div id="root"></div>

  <!-- Load component definitions -->
  <script type="text/babel" src="sp-kit.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="pages/app.jsx"></script>

        ),
        notes: "Here is the core crew. Akki focuses on founder relations and direction. Vikram leads script narratives. Priya runs our editing bay. Natasha handles the lens work. Rahul leads digital and React development. And Commy, our resident dog, ensures our copy contains impeccable commas."
      },
      // 10. Why us
      {
        id: 'why-us',
        render: () => (

            <div className="slide-header">
              <span>blackspace® deck</span>
              <span>10 / core convictions</span>

              <div>

                <p style={{ fontSize: '18px', opacity: 0.8, lineHeight: '1.5', margin: 0 }}>
                  We operate as a high-density creative team. We remove the layers of corporate client service directors, bringing the final decision-makers directly to the conversation from Day 0.
                </p>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                {[
                  { num: 'I', title: 'Speed & Directness', desc: 'No accounts managers. Talk directly to the writers and developers.' },
                  { num: 'II', title: 'Grammar & Taste', desc: 'We write scripts with absolute editorial rigor and visual personality.' },
                  { num: 'III', title: 'Source Code Ownership', desc: 'We deliver completed code blocks and raw footage without restrictions.' }
                ].map((item, idx) => (
                  <div key={idx} style={{ display: 'flex', gap: '16px', alignItems: 'flex-start', borderBottom: '1px solid rgba(10,10,10,0.1)', paddingBottom: '12px' }}>
                    <span className="font-italic" style={{ fontSize: '32px', fontWeight: 'bold', color: 'var(--pop-a)', lineHeight: '1' }}>{item.num}</span>
                    <div>
                      <h4 style={{ fontSize: '18px', margin: '0 0 4px 0', fontFamily: 'var(--font-display)' }}>{item.title}</h4>
                      <p style={{ fontSize: '13px', margin: 0, opacity: 0.75, lineHeight: '1.4' }}>{item.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            
            <div className="slide-footer">
              <span>Convictions</span>
              <span>Slide 10 of 12</span>

          </div>
        ),
        notes: "Why choose our model? First, speed and directness. You talk straight to the builders. Second, visual taste. We don't build flat templates; we design bespoke Sticker Pop layouts. Third, full source code ownership. Once we ship, the files are 100% yours."
      },
      // 11. Engagements
      {
        id: 'engagements',
        render: () => (
          <div className="slide-wrapper">
            <div className="slide-header">
              <span>blackspace® deck</span>
              <span>11 / engagement scales</span>
            </div>
            
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', flexGrow: 1, justifyContent: 'center' }}>
              <h2 style={{ fontSize: '44px', margin: 0 }}>Engagement Packages</h2>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
                {[
                  { tier: 'Sprint Core', price: '$8k', desc: 'Bespoke brand system design or full 6-step copywriting project.', bg: 'var(--mint)' },
                  { tier: 'Production Plus', price: '$22k', desc: '1 commercial film, color correction, and sound design suite setup.', bg: 'var(--lilac)' },
                  { tier: 'Enterprise Portal', price: '$45k', desc: 'Interactive React/WebGL platform, campaign movies, and prompt automation.', bg: 'var(--sky)' }
                ].map((tier, idx) => (
                  <div key={idx} className="deck-card" style={{ background: tier.bg, padding: '24px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', minHeight: '260px' }}>
                    <div>
                      <span style={{ fontSize: '11px', textTransform: 'uppercase', fontWeight: 'bold', opacity: 0.6 }}>Engagement Tier</span>
                      <h3 style={{ fontSize: '28px', margin: '8px 0 4px 0', fontFamily: 'var(--font-display)' }}>{tier.tier}</h3>
                      <p style={{ fontSize: '13px', opacity: 0.8, lineHeight: '1.4', margin: 0 }}>{tier.desc}</p>

                    <div style={{ borderTop: '1px solid var(--ink)', paddingTop: '16px', marginTop: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

        notes: "That completes the deck walkthrough. Let's build something beautiful. I have two simple questions: What are you building? And when do we start? You can reach us at hello@blackspace.media. Thank you."

    function SPDeck() {
      const [currentSlide, setCurrentSlide] = React.useState(0);
      const [showNotes, setShowNotes] = React.useState(false);

      const nextSlide = React.useCallback(() => {
        setCurrentSlide((prev) => Math.min(prev + 1, deckSlides.length - 1));
      }, []);

      const prevSlide = React.useCallback(() => {
        setCurrentSlide((prev) => Math.max(prev - 1, 0));
      }, []);

      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === 'Space') {
            nextSlide();
          } else if (e.key === 'ArrowLeft') {
            prevSlide();
          } else if (e.key === 'n' || e.key === 'N') {
            setShowNotes((prev) => !prev);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [nextSlide, prevSlide]);

      const slide = deckSlides[currentSlide];

      return (
        <div style={{
          width: '100vw',
          height: '100vh',
          backgroundColor: '#0a0a0a',
          position: 'relative',
          overflow: 'hidden',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center'
        }}>
          
          {/* Deck scaling stage */}
          <div id="deck-container">
            {slide.render()}
          </div>

          {/* Navigation Controls HUD (Sticky Overlay) */}
          <div className="no-print" style={{
            position: 'fixed',
            bottom: '24px',
            left: '50%',
            transform: 'translateX(-50%)',
            zIndex: 10000,
            background: 'rgba(10, 10, 10, 0.85)',
            backdropFilter: 'blur(10px)',
            border: '1px solid rgba(255, 255, 255, 0.15)',
            borderRadius: '999px',
            padding: '8px 24px',
            display: 'flex',
            alignItems: 'center',
            gap: '20px',
            color: '#fff',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            boxShadow: '0 4px 20px rgba(0,0,0,0.5)'
          }}>
            <button 
              onClick={prevSlide}
              disabled={currentSlide === 0}
              style={{
                background: 'transparent',
                border: 'none',
                color: currentSlide === 0 ? 'rgba(255,255,255,0.3)' : '#fff',
                fontSize: '18px',
                cursor: currentSlide === 0 ? 'default' : 'pointer',
                padding: '4px 10px',
                fontWeight: 'bold'
              }}
            >
              ←
            </button>
            <span style={{ fontSize: '13px', fontWeight: 'bold', minWidth: '80px', textAlign: 'center' }}>
              Slide {currentSlide + 1} / {deckSlides.length}
            </span>
            <button 
              onClick={nextSlide}
              disabled={currentSlide === deckSlides.length - 1}
              style={{
                background: 'transparent',
                border: 'none',
                color: currentSlide === deckSlides.length - 1 ? 'rgba(255,255,255,0.3)' : '#fff',
                fontSize: '18px',
                cursor: currentSlide === deckSlides.length - 1 ? 'default' : 'pointer',
                padding: '4px 10px',
                fontWeight: 'bold'
              }}
            >
              →
            </button>
            <div style={{ height: '16px', width: '1px', background: 'rgba(255,255,255,0.2)' }} />
            <button
              onClick={() => setShowNotes((prev) => !prev)}
              style={{
                background: showNotes ? 'var(--mint)' : 'transparent',
                border: '1px solid ' + (showNotes ? 'var(--mint)' : 'rgba(255,255,255,0.3)'),
                color: showNotes ? 'var(--ink)' : '#fff',
                padding: '4px 14px',
                borderRadius: '999px',
                fontSize: '11px',
                fontWeight: 'bold',
                cursor: 'pointer'
              }}
            >
              Speaker Notes (N)
            </button>
            <button
              onClick={() => window.print()}
              style={{
                background: 'transparent',
                border: '1px solid rgba(255,255,255,0.3)',
                color: '#fff',
                padding: '4px 14px',
                borderRadius: '999px',
                fontSize: '11px',
                fontWeight: 'bold',
                cursor: 'pointer'
              }}
            >
              PDF ⎙
            </button>
          </div>

          {/* Speaker Notes Overlay Drawer */}
          {showNotes && (
            <div className="no-print" style={{
              position: 'fixed',
              bottom: '90px',
              left: '50%',
              transform: 'translateX(-50%)',
              width: '800px',
              maxHeight: '180px',
              overflowY: 'auto',
              background: '#fcfcfc',
              color: '#1a1a1a',
              border: '2px solid #000',
              boxShadow: '0 8px 30px rgba(0,0,0,0.6)',
              borderRadius: '12px',
              padding: '20px',
              zIndex: 10001,
              fontFamily: 'var(--font-body), sans-serif',
              fontSize: '15px',
              lineHeight: '1.5'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', borderBottom: '1px solid rgba(0,0,0,0.1)', paddingBottom: '4px' }}>
                <span style={{ fontWeight: 'bold', textTransform: 'uppercase', fontSize: '11px', letterSpacing: '0.1em', color: 'var(--pop-a)' }}>✳ Speaker Script</span>
                <button 
                  onClick={() => setShowNotes(false)}
                  style={{ background: 'transparent', border: 'none', fontWeight: 'bold', cursor: 'pointer', fontSize: '12px' }}
                >
                  ✕ Close
                </button>
              </div>
              <p style={{ margin: 0 }}>{slide.notes}</p>
            </div>
          )}
          
          {/* Tweaks Panel overlay for testing configurations inside the deck */}
          <div style={{ display: 'none' }}>
            <window.SPTweaksPanel
              currentTheme="Classic"
              onThemeChange={() => {}}
              currentType="Acid+Gara+Helv"
              onTypeChange={() => {}}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SPDeck />);
  </script>
</body>
</html>
